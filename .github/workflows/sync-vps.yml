name: Sync VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: sync-vps

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest changes on VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@"$HOST"
